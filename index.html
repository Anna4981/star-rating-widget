<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Rating Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Rate your experience</h1>

    <div class="stars" id="stars" role="radiogroup" aria-label="Star rating">
      <button class="star" data-value="1" role="radio" aria-checked="false" aria-label="1 star">&#9733;</button>
      <button class="star" data-value="2" role="radio" aria-checked="false" aria-label="2 stars">&#9733;</button>
      <button class="star" data-value="3" role="radio" aria-checked="false" aria-label="3 stars">&#9733;</button>
      <button class="star" data-value="4" role="radio" aria-checked="false" aria-label="4 stars">&#9733;</button>
      <button class="star" data-value="5" role="radio" aria-checked="false" aria-label="5 stars">&#9733;</button>
    </div>

    <p class="display" id="display" aria-live="polite">No rating yet</p>

    <button class="reset" id="reset" type="button">Reset</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
